name: Supabase Keep-Alive (Evita pausa en Free Tier)

on:
  schedule:
    # Se ejecuta cada 4 días a las 06:00 UTC (evita la pausa de inactividad de 7 días de Supabase Free)
    - cron: '0 6 */4 * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions en GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -f -o /dev/null \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtZGxpZ3VlbWN3aXJmam1icGZnIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5NDg3MjIyMCwiZXhwIjoyMTEwNDQ4MjIwfQ.IBKc4ED7kAhbVbqtiRV7gHBrQOuhJr3dJDoJd7cmphQ' }}" \
            "https://smdliguemcwirfjmbpfg.supabase.co/rest/v1/schools?select=id&limit=1" \
          && echo "✅ Supabase ping exitoso - Base de datos activa" \
          || echo "⚠️ Error al hacer ping a Supabase"

