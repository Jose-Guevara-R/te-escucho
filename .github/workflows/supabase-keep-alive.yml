name: Keep-Alive (Supabase + Render Free)

on:
  schedule:
    # 1. Pings regulares de lunes a viernes en horario escolar (07:00 a 18:00 hora de Lima = 12:00 a 23:00 UTC) para evitar que Render se duerma
    - cron: '*/15 12-23 * * 1-5'
    # 2. Ping de rescate cada 4 días para que Supabase nunca se pause por inactividad
    - cron: '0 6 */4 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service (Prevenir suspensión)
        run: |
          curl -s -f -o /dev/null "https://te-escucho-2rl4.onrender.com/api/platform/capabilities" \
          && echo "✅ Render ping exitoso - Servidor despierto" || echo "⚠️ Render en suspensión o error"

      - name: Ping Supabase REST API (Prevenir pausa de base de datos)
        run: |
          curl -s -f -o /dev/null \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtZGxpZ3VlbWN3aXJmam1icGZnIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5NDg3MjIyMCwiZXhwIjoyMTEwNDQ4MjIwfQ.IBKc4ED7kAhbVbqtiRV7gHBrQOuhJr3dJDoJd7cmphQ' }}" \
            "https://smdliguemcwirfjmbpfg.supabase.co/rest/v1/schools?select=id&limit=1" \
          && echo "✅ Supabase ping exitoso - Base de datos activa" || echo "⚠️ Error al conectar con Supabase"
